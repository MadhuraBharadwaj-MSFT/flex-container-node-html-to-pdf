# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: flex-container-node-html-to-pdf
metadata:
  template: flex-container-node-html-to-pdf@1.1.0

infra:
  provider: bicep
  path: ./infra

hooks:
  postprovision:
    windows:
      shell: pwsh
      run: ./scripts/post-provision.ps1
      interactive: false
      continueOnError: false
    posix:
      shell: sh
      run: ./scripts/post-provision.sh
      interactive: false
      continueOnError: false
  postdeploy:
    windows:
      shell: pwsh
      run: ./scripts/post-deploy.ps1
      interactive: false
      continueOnError: false
    posix:
      shell: sh
      run: ./scripts/post-deploy.sh
      interactive: false
      continueOnError: false
